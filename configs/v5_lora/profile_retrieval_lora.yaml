data:
  item_meta: data/processed/v3/microlens_100k/item_meta.csv
  item_ids: data/processed/v3/microlens_100k/item_ids.csv
  train_samples: data/processed/v3/microlens_100k/behavior_samples_train.csv
  val_samples: data/processed/v3/microlens_100k/behavior_samples_val.csv
  test_samples: data/processed/v3/microlens_100k/behavior_samples_test.csv
  feature_config: data/processed/v3/microlens_100k/feature_config.json
  profiles_raw: data/processed/v5_lora/microlens_100k/profiles_lora_raw.jsonl
  profiles_clean: data/processed/v5_lora/microlens_100k/profiles_lora_clean.jsonl
  profile_text: data/processed/v5_lora/microlens_100k/profile_text_lora.csv
  profile_item_ids: outputs/v5_lora/microlens_100k/embeddings/profile_item_ids.npy
  profile_embeddings: outputs/v5_lora/microlens_100k/embeddings/profile_embeddings.npy
  profile_index: outputs/v5_lora/microlens_100k/indexes/profile_faiss.index
  index_config: outputs/v5_lora/microlens_100k/indexes/profile_faiss_config.json
  quality_report: data/processed/v5_lora/microlens_100k/profile_quality_report.json

profile_text:
  mode: lora_compact

embedding:
  model_name: BAAI/bge-m3
  batch_size: 64
  max_seq_length: 512
  normalize_embeddings: true
  device: auto

retrieval:
  metric: cosine
  ks: [10, 20, 50, 100]
  max_history_len: 50
  user_batch_size: 256
  max_eval_users: -1
  methods:
    - title
    - profile
    - multimodal
    - fusion
  fusion_weights:
    title: 0.3
    profile: 0.5
    image: 0.1
    video: 0.1

output:
  embedding_config: outputs/v5_lora/microlens_100k/embeddings/profile_embedding_config.json
  metrics: outputs/v5_lora/microlens_100k/reports/profile_recall_test_metrics.json
  case_study: outputs/v5_lora/microlens_100k/reports/profile_case_study.json
